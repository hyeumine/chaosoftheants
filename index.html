<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Chaos of the Ants</title><link rel='stylesheet' href='css/style.css'></head><body>
<header><div><h1>Chaos of the Ants</h1><p>Decentralized swarm routing laboratory</p></div><div class='badge' id='phase'>READY</div></header>
<main><section class='stage'><canvas id='world'></canvas><div class='legend'><span>● Nest</span><span>◆ Food</span><span>■ Obstacle</span><span>— Food trail</span><span>— Home trail</span></div></section>
<aside><div class='panel'><h2>Simulation</h2><div class='buttons'><button id='start'>Start</button><button id='pause'>Pause</button><button id='reset'>Reset</button><button id='destroy'>Destroy Route</button></div><label>Tool<select id='tool'><option value='obstacle'>Paint obstacle</option><option value='erase'>Erase</option><option value='food'>Move food</option><option value='nest'>Move nest</option></select></label><small>Click/drag directly on the world.</small></div>
<div class='panel'><h2>Parameters</h2><div id='controls'></div></div>
<div class='panel'><h2>Layers</h2><label><input type='checkbox' id='showFood' checked> Food pheromone</label><label><input type='checkbox' id='showHome' checked> Home pheromone</label><label><input type='checkbox' id='showAnts' checked> Ants</label><label><input type='checkbox' id='showEncounters' checked> Encounters</label><label><input type='checkbox' id='showHeat'> Exploration heatmap</label></div>
<div class='panel'><h2>Live Statistics</h2><div id='stats'></div><button id='csv'>Download CSV</button></div></aside></main>
<footer>CoA model: Explore → Encounter → Reinforce → Forget. No agent has a global map.</footer><script type='module' src='js/app.js'></script></body></html>
